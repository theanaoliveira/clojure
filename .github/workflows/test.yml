name: Run Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh
          rm linux-install.sh

      - name: Run tests
        run: |
          clojure -Sdeps '{:paths ["src" "test"]}' -M -e "
            (require '[clojure.java.io :as io] '[clojure.test :as test])
            (doseq [file (filter #(.isFile %) (file-seq (io/file \"test\")))]
              (when (.endsWith (.getName file) \".clj\")
                (load-file (.getPath file))))
            (let [summary (test/run-all-tests)]
              (when (pos? (+ (:fail summary) (:error summary)))
                (System/exit 1)))"
